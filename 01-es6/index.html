<!doctype html>
<head>
  <title>ES6 Object Display</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .student-info {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 8px;
      background-color: #f9f9f9;
      margin-bottom: 20px;
    }
    .students-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .student-card {
      border: 2px solid #2196f3;
      padding: 15px;
      border-radius: 8px;
      background-color: #e3f2fd;
    }
    .student-card h3 {
      margin-top: 0;
      color: #1976d2;
    }
    h2 {
      color: #333;
    }
    .detail {
      margin: 8px 0;
      font-size: 15px;
    }
    .label {
      font-weight: bold;
      color: #555;
    }
    .code-section {
      background-color: #f5f5f5;
      border-left: 4px solid #2196f3;
      padding: 15px;
      margin-top: 30px;
      border-radius: 4px;
    }
    pre {
      overflow-x: auto;
      font-size: 12px;
    }
  </style>

</head>
